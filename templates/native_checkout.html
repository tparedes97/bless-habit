<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bless Habit Premium</title>
<!-- Checkout de Paddle para la app de Android: esta página se abre en el navegador
     del sistema (no en el WebView de la app) desde /premium/native-checkout. -->
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f6fd; color: #241f3a; font-family: Inter, system-ui, -apple-system, sans-serif; }
  .card { max-width: 380px; margin: 16px; padding: 28px 22px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(104,82,221,.12); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #6b6585; margin: 0 0 18px; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; text-decoration: none; cursor: pointer; background: linear-gradient(135deg, #7c6cf0, #a58cff); color: #fff; margin-top: 10px; }
  .btn.secondary { background: #efecfb; color: #4b3fb0; }
</style>
</head>
<body>
<div class="card">
  <h1>✨ Bless Habit Premium</h1>
  {% if error %}
    <p>{{ error }}</p>
  {% else %}
    <p id="msg">Sin publicidad + métricas completas — {{ price_label }}. Cobro automático vía Paddle, cancelas cuando quieras.</p>
    <button class="btn" id="pay-btn">Hazte Premium — {{ price_label }}</button>
  {% endif %}
  <a class="btn secondary" id="return-btn" href="{{ return_url }}">Volver a Bless Habit</a>
</div>
{% if not error %}
<script>
  const RETURN_URL = {{ return_url | tojson }};
  const msg = document.getElementById('msg');
  const payBtn = document.getElementById('pay-btn');
  function openCheckout() {
    if (typeof Paddle === 'undefined') {
      msg.textContent = 'No se pudo cargar el widget de pago de Paddle. Revisa tu conexión e intenta de nuevo.';
      return;
    }
    Paddle.Checkout.open({
      items: [{ priceId: {{ price_id | tojson }}, quantity: 1 }],
      customer: {{ email | tojson }} ? { email: {{ email | tojson }} } : undefined,
      customData: { app_user_email: {{ email | tojson }} },
    });
  }
  if (typeof Paddle !== 'undefined') {
    if ({{ paddle_env | tojson }} !== 'production') Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      token: {{ client_token | tojson }},
      eventCallback: function (event) {
        // Quien activa el Premium de verdad es el webhook /webhooks/paddle; la app
        // consulta /api/subscription-status cuando el usuario vuelve.
        if (event.name === 'checkout.completed') {
          Paddle.Checkout.close();
          payBtn.style.display = 'none';
          msg.textContent = '¡Gracias! Tu pago se está confirmando. Vuelve a la app para ver tu Premium activo.';
          window.location.href = RETURN_URL;
        }
      },
    });
  }
  payBtn.onclick = openCheckout;
  openCheckout();
</script>
{% endif %}
</body>
</html>
